services:

  db:
    image: postgres:17
    container_name: postgres-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  web:
    build: .
    container_name: studyhub-app

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - db

    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

    restart: unless-stopped

volumes:
  postgres-data:
  static-data:
  media-data:
